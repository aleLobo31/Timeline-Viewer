services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timeline
      POSTGRES_PASSWORD: timeline
      POSTGRES_DB: timeline
    ports:
      # Loopback only: the dev credentials must never be reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timeline -d timeline']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
