name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timeline
          POSTGRES_PASSWORD: timeline
          POSTGRES_DB: timeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timeline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://timeline:timeline@localhost:5432/timeline_test?schema=public
      TEST_DATABASE_URL: postgresql://timeline:timeline@localhost:5432/timeline_test?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timeline
          POSTGRES_PASSWORD: timeline
          POSTGRES_DB: timeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timeline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://timeline:timeline@localhost:5432/timeline?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy -w @timeline-viewer/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
